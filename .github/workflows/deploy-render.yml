name: Auto-Deploy Backend to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set in GitHub Actions Secrets; skipping automatic Render trigger."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
          echo "Triggered Render deployment cleanly."
